[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API: auth, persistence and the static frontend"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.142.2",
    "litellm>=1.104.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `live` call the real model; run them with `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls the real LLM (needs OPENROUTER_API_KEY)"]
